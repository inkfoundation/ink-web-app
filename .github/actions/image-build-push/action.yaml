name: image-build-push
description: Build and push a Docker image to GitHub Container Registry
inputs:
  repository-name:
    description: The name of the service to build and push
    required: true
  dockerfile-path:
    description: The path to the Dockerfile for the service
    required: true
  github-token:
    description: The GitHub token
    required: true
  docker-context:
    description: The docker context path
    required: true
outputs:
  digest:
    description: The digest of the built image
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - id: metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ghcr.io/inkfoundation/${{ inputs.repository-name }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=main,enable={{is_default_branch}}
          type=raw,value=staging,enable=${{ github.ref == 'refs/heads/ops/preview-1' }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.dockerfile-path }}
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        build-args: |
          GITHUB_SHA=${{ github.sha }}
