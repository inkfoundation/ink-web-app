name: PR Checks
on: [pull_request]
jobs:
  install_modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Enable corepack (pnpm)
        shell: bash
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add pnpm store path to env var
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            **/node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

  lint:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Generate dummy .env.production
        run: ./scripts/generate-dummy-dotenv.sh
      - name: Run linting
        run: pnpm run lint

  format:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Generate dummy .env.production
        run: ./scripts/generate-dummy-dotenv.sh
      - name: Run formatting
        run: pnpm run format:check

  build:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Generate dummy .env.production
        run: ./scripts/generate-dummy-dotenv.sh
      # Restores Turbopack's persistent build cache (.next/cache) so builds are
      # incremental; saved automatically at the end of the job on a cache miss.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'messages/**', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Building app
        run: pnpm run build
